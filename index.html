<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Smart Expense Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              mono: ['JetBrains Mono', 'monospace'],
            },
            colors: {
              ledger: {
                paper: '#f0fdf4', // emerald-50
                line: '#86efac',  // emerald-300
                header: '#15803d', // emerald-700
                text: '#14532d',   // emerald-900
                highlight: '#dcfce7' // emerald-100
              }
            }
          },
        },
      }
    </script>
    <style>
      /* Custom scrollbar for table bodies */
      .ledger-scroll::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      .ledger-scroll::-webkit-scrollbar-track {
        background: #f0fdf4;
      }
      .ledger-scroll::-webkit-scrollbar-thumb {
        background: #86efac;
        border-radius: 4px;
      }
      .ledger-scroll::-webkit-scrollbar-thumb:hover {
        background: #4ade80;
      }
      input[type="number"]::-webkit-inner-spin-button,
      input[type="number"]::-webkit-outer-spin-button {
        -webkit-appearance: none;
        margin: 0;
      }
    </style>

  }
}
</script>
